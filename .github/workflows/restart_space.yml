name: Daily Space Restart
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-refs/heads/main
  cancel-in-progress: false
jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Restart Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -eu
          test -n "$HF_TOKEN"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 60 \
            -X POST https://huggingface.co/api/spaces/dICTORTAniBani/dicasdf/restart \
            -H "Authorization: Bearer $HF_TOKEN" --output /dev/null
          echo 'Space restart requested.'
